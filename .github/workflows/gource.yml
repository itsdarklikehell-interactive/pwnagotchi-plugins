name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gource:
    uses: itsdarklikehell-interactive/ci-templates/.github/workflows/gource-reusable.yml@7063677573deee4a6d4c15533d3451225486f9ed
    permissions:
      contents: write
      actions: read
      pull-requests: write

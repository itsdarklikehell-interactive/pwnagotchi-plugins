name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gource:
    uses: itsdarklikehell-interactive/ci-templates/.github/workflows/gource-reusable.yml@5d44fcd97f6ea8cf05ae6f0298fe84ac56829cba
    permissions:
      contents: write
      actions: read
      pull-requests: write
